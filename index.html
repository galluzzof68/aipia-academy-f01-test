</style></head><body><header><h1>AI Professional Academy · F01</h1><p>Percorso F01 · test a fine di ogni sottomodulo · versione pilota · autovalutazione guidata</p></header><nav id="nav"></nav><main id="main"></main><footer>Contenuti revisionati internamente · Non costituiscono certificazione UNI</footer><script id="source" type="application/json">{"release":"F01-GATE0-sorgente-unica-2026-10-12","generated_from":"Sette Word riconciliati Gate 0 (checksum nel manifesto)","notice":"IN AUDIT; nessuna validazione scientifica o didattica indipendente. Quiz e tutor offline derivano da release precedente; non ricalibrati. File locali non costituiscono LMS multiutente.","lessons":[{"id":"F01.01","title":"Che cos’è un sistema AI","hours_nominal":1.5,"source_file":"contenuti/F01.01.docx","sha256":"ff2b6d158a31bbcff85f8bbe21ed5cceed64b2b587debd83bee0a2c016a18202","blocks":[{"type":"h","text":"F01.01 — Che cos’è un sistema di intelligenza artificiale"},{"type":"p","text":"Versione di lavoro per riesame · Testo didattico consolidato · 12 ottobre 2026"},{"type":"h","text":"Lezione"},{"type":"p","text":"F01.01 | Che cos’è un sistema di intelligenza artificiale"},{"type":"h","text":"Risultati e modalità di studio"},{"type":"p","text":"Distinguere funzione automatizzata, modello AI e sistema complessivo, senza usare il marketing come prova tecnica."},{"type":"p","text":"Spiegare con parole proprie autonomia, inferenza, input e output nella definizione europea."},{"type":"p","text":"Indicare se un esempio usa machine learning e/o generazione di contenuti; motivare i casi indeterminati."},{"type":"p","text":"Individuare i controlli richiesti prima che un output AI contribuisca a un atto o a una decisione professionale."},{"type":"p","text":"Percorso consigliato: 15 min concetti → 20 min esempi → 15 min ragionamento guidato → 25 min laboratorio → 10 min quiz → 5 min autovalutazione. Per lo studio autonomo si può impiegare più tempo; le durate sono indicative."},{"type":"h","text":"1. Dal software tradizionale al sistema AI"},{"type":"p","text":"Un sistema informatico riceve input, li elabora e produce output. Questa descrizione vale tanto per una calcolatrice quanto per un classificatore di documenti: da sola NON identifica l’AI. La distinzione richiede di osservare il meccanismo che produce il risultato. Un programma può eseguire istruzioni completamente specificate dagli sviluppatori, mentre un sistema AI può inferire come produrre previsioni, contenuti, raccomandazioni o decisioni tramite modelli. Il confine non si riduce alla frase “usa dati”: qualsiasi software usa dati."},{"type":"p","text":"L’art. 3(1) del Regolamento (UE) 2024/1689 descrive un sistema basato su macchine, progettato per funzionare con diversi livelli di autonomia, eventualmente adattivo dopo il rilascio, che per obiettivi espliciti o impliciti inferisce dagli input ricevuti come generare output capaci di influenzare ambienti fisici o virtuali. Questa è una definizione giuridica: il suo uso per un prodotto concreto richiede un esame delle funzionalità e del contesto. È scorretto trattarla come una check-list meccanica con un singolo indicatore sufficiente."},{"type":"p","text":"Le parole che fanno la differenza"},{"type":"p","text":"Esempio: un sistema riceve il testo di una PEC (input) e propone una categoria di smistamento (output). Per dire se usa AI dobbiamo sapere se applica una tabella fissa di regole, un classificatore appreso dai dati o un altro modello inferenziale. Il risultato osservato, da solo, non è prova sufficiente."},{"type":"h","text":"2. Automazione, AI, machine learning e AI generativa"},{"type":"p","text":"“Automazione” indica lo svolgimento automatico di compiti: non è il contrario di AI. Un workflow può automatizzare passaggi mediante regole e integrare un servizio AI solo in un punto. “Intelligenza artificiale” è una famiglia ampia di metodi e sistemi inferenziali. Il machine learning è un insieme di metodi che ricavano modelli da esempi o dati; l’AI generativa produce nuovi contenuti come testo, immagini, suono o codice, spesso mediante machine learning."},{"type":"p","text":"Attenzione: anche alcuni sistemi AI simbolici ragionano su conoscenza e regole. Non è corretto affermare che «ogni sistema a regole non è AI». Occorre distinguere l’automazione con regole fisse da sistemi inferenziali più articolati; la qualificazione regolatoria può dipendere dal caso concreto. È altrettanto errato dire che «se non apprende in produzione, non è AI»."},{"type":"h","text":"3. Modello AI, prodotto software e processo organizzativo"},{"type":"p","text":"Un modello è un componente computazionale, non necessariamente l’intero sistema distribuito agli utenti. Un servizio può includere interfaccia, autenticazione, retrieval di documenti, modello linguistico, strumenti di verifica, database e procedure umane. Un processo aziendale o amministrativo è ancora più ampio: ha persone, autorizzazioni, scadenze e responsabilità. Analizzare questi tre livelli evita di attribuire al modello capacità e garanzie che appartengono invece al processo."},{"type":"h","text":"4. Tre esempi guidati con metodo passo-passo"},{"type":"p","text":"Caso A — Una determina predisposta con AI"},{"type":"p","text":"Scenario: il professionista fornisce dati procedimentali e indicazioni; un LLM propone una bozza. 1) Input: dati, istruzioni e fonti rese accessibili. 2) Elaborazione: modello generativo. 3) Output: testo proposto. 4) Rischio: citazioni inventate, norme non vigenti, assunzioni su dati mancanti. 5) Controllo: lettura delle fonti originali, verifica dati, base giuridica e coerenza dell’atto. La validazione del professionista è una prestazione sostanziale; la successiva adozione dell’atto spetta ai soggetti competenti secondo legge."},{"type":"p","text":"Caso B — Un sistema che smista PEC"},{"type":"p","text":"Scenario: ogni PEC viene indirizzata a un ufficio. Versione 1: se il testo contiene una stringa definita, applica una regola preimpostata; descriveremmo anzitutto un’automazione a regole. Versione 2: un classificatore addestrato su esempi assegna probabilità alle categorie: contiene ML. Versione 3: sappiamo soltanto che «smista automaticamente»: risposta corretta, per la tecnologia, NON DETERMINABILE. Chiedere documentazione tecnica e dati di valutazione."},{"type":"p","text":"Caso C — Dashboard che prevede la domanda"},{"type":"p","text":"Il calcolo di totale, quota percentuale o media tramite formula non rende AI la dashboard. Un modello addestrato per previsione della domanda è invece un possibile componente ML. Bisogna distinguere la funzione di visualizzazione dalla funzione predittiva, e verificare su quali dati storici la previsione è stata valutata."},{"type":"h","text":"5. Una procedura di classificazione in cinque domande"},{"type":"p","text":"Qual è il compito osservato (e non il nome commerciale del software)?"},{"type":"p","text":"Quali sono input, output e gli eventuali effetti sulle persone o sui processi?"},{"type":"p","text":"Sappiamo come vengono prodotti i risultati (regole fisse, modello appreso, sistema inferenziale simbolico, combinazione)?"},{"type":"p","text":"Quale evidenza tecnica manca, e quindi quale parte rimane «non determinabile»?"},{"type":"p","text":"Quali verifiche umane servono prima di usarne l’output in un contesto professionale?"},{"type":"h","text":"6. Laboratorio individuale: dieci casi"},{"type":"p","text":"Per ogni riga: (a) AI sì/no/non determinabile con le informazioni date; (b) ML/GenAI se noto; (c) input e output; (d) controllo umano; (e) ragione della risposta. I casi volutamente incompleti devono essere motivati senza indovinare."},{"type":"p","text":"Modello di risposta: «Nel caso 2 il modello è descritto come addestrato su dati storici: è ragionevole classificarlo come ML predittivo. Input: caratteristiche delle pratiche; output: stima dei tempi. Controllo: confronto con casi nuovi e revisione quando si usano le stime per pianificare il lavoro»."},{"type":"h","text":"7. Verifica individuale (10 domande)"},{"type":"p","text":"1. Un sistema AI deve aggiornarsi autonomamente dopo il deployment? A sempre · B no · C solo se pubblico · D solo se produce testo"},{"type":"p","text":"2. Le categorie AI e ML sono: A sinonimi · B ML sottoinsieme metodologico di AI · C alternative incompatibili · D termini legali identici"},{"type":"p","text":"3. Una dashboard di somme e percentuali è AI per definizione? A sì · B no · C solo con database · D solo se usata in PA"},{"type":"p","text":"4. Un LLM scrive un riferimento a una sentenza: A basta la plausibilità · B bisogna verificare fonte originale e pertinenza · C basta ripetere il prompt · D la firma corregge tutto"},{"type":"p","text":"5. Un sistema classifica PEC ma la tecnologia non è dichiarata: A certamente ML · B certamente a regole · C tecnologia non determinabile · D certamente GenAI"},{"type":"p","text":"6. La generazione di testo è: A una possibile funzione GenAI · B la definizione completa di AI · C sempre automazione a regole · D sempre affidabile"},{"type":"p","text":"7. Il modello rispetto al workflow è: A tutto il processo · B un possibile componente · C il responsabile giuridico · D sempre la sola componente"},{"type":"p","text":"8. Un motore a regole è necessariamente escluso dall’AI? A sì sempre · B no, serve valutare la specifica capacità inferenziale · C sempre ML · D sempre generativo"},{"type":"p","text":"9. Quale informazione aiuta a valutare un classificatore? A solo il nome commerciale · B dati e metriche su casi rappresentativi · C solo il logo · D il numero di pagine web"},{"type":"p","text":"10. Una supervisione professionale adeguata è: A firma senza lettura · B controllo sostanziale su dati, fonti e output · C cambio di font · D richiesta di output più lungo"},{"type":"h","text":"8. Autovalutazione e consegna"},{"type":"p","text":"Consegna: tabella dei dieci casi con motivazioni, quiz compilato e una riflessione di 150–200 parole su cosa rende rischiosa una bozza amministrativa generata da AI. Obiettivo formativo: spiegare almeno otto classificazioni coerentemente e identificare sempre i casi tecnicamente indeterminati. Le soluzioni saranno disponibili dopo la consegna nel sistema didattico, non in questo file."},{"type":"h","text":"Riferimenti essenziali e controllo delle fonti"},{"type":"p","text":"Regolamento (UE) 2024/1689, art. 3(1) — definizione legale di sistema AI: https://eur-lex.europa.eu/eli/reg/2024/1689/oj"},{"type":"p","text":"OECD (2024), Explanatory memorandum on the updated OECD definition of an AI system: https://www.oecd.org/en/publications/explanatory-memorandum-on-the-updated-oecd-definition-of-an-ai-system_623da898-en.html"},{"type":"p","text":"Google, Machine Learning Crash Course (per gli approfondimenti ML): https://developers.google.com/machine-learning/crash-course"},{"type":"p","text":"NIST, AI Risk Management Framework 1.0 (contesto di gestione dei rischi): https://www.nist.gov/itl/ai-risk-management-framework"},{"type":"p","text":"Nota editoriale: le citazioni sono presentate come riferimenti da consultare nella versione vigente; le interpretazioni dei casi sono didattiche e non costituiscono consulenza legale. Il materiale non riproduce il testo della UNI 11621-8."},{"type":"h","text":"Precisazione scientifica integrata"},{"type":"p","text":"Un programma che applica una serie di condizioni scritte interamente dal progettista (per esempio «se una PEC contiene la stringa X, assegnala alla categoria Y») non diventa automaticamente un sistema di IA perché il fornitore lo pubblicizza come «intelligente». Occorre esaminare le proprietà del sistema rispetto alla definizione normativa applicabile: sistema basato su macchina, livelli variabili di autonomia, capacità di inferire dagli input come produrre output quali previsioni, contenuti, raccomandazioni o decisioni, e possibile influenza su ambienti fisici o virtuali. L’adattabilità successiva alla messa in esercizio è eventuale, non indispensabile. Per classificare uno smistatore PEC, il discente deve richiedere documentazione sull’effettivo meccanismo di inferenza e sul margine di autonomia, non scegliere dalla sola interfaccia. Il fatto che un sistema usi machine learning può orientare il giudizio, ma non sostituisce la verifica della definizione e delle esclusioni pertinenti."},{"type":"h","text":"Attività di controllo applicativo"},{"type":"p","text":"Classifica tre soluzioni: filtro PEC basato su parole chiave, classificatore addestrato su casi storici, assistente che genera una bozza. Per ciascuna indica output, grado di autonomia, evidenza da chiedere e ciò che resta indeterminato. Non dedurre la qualificazione giuridica dal solo nome commerciale."},{"type":"h","text":"Fonti del controllo mirato"},{"type":"p","text":"Fonte: Regolamento (UE) 2024/1689, art. 3(1), testo vigente; AIPIA Glossario, voce «sistema di intelligenza artificiale».\nhttps://ai-act-service-desk.ec.europa.eu/en/ai-act/article-3"},{"type":"p","text":"Avvertenza di audit: la presenza di queste fonti non prova la validità di ogni affermazione presente nell’intera lezione. È richiesto riesame indipendente e misurazione dei tempi."},{"type":"h","text":"9. Trasferimento nel proprio contesto professionale (recupero RC2)"},{"type":"p","text":"Attività: individua tre strumenti usati nel tuo lavoro o in un contesto simulato: un sistema di protocollazione, uno strumento che stima tempi di risposta e un generatore di bozze. Per ciascuno descrivi il compito, input, output, elementi noti dell’architettura, autonomia, eventuale inferenza e controlli umani necessari. Non introdurre dati personali reali."},{"type":"p","text":"Consegna una tabella a tre righe. Classifica ogni esempio come «AI», «non AI» oppure «non determinabile con le informazioni date» e annota quale evidenza chiedere al fornitore. Non attribuire tecnologie non documentate."},{"type":"p","text":"Autoverifica: riesci a spiegare perché un prodotto pubblicizzato come «intelligente» non è necessariamente un sistema AI? Sai distinguere un modello general purpose dal servizio che lo incorpora? Sai motivare la conclusione «informazioni insufficienti»?"},{"type":"p","text":"Nota di provenienza: recuperati e integrati, senza duplicare i quiz, l’«Esercizio nuovo — classificazione motivata» e l’«Esercizio indipendente di analisi tecnologica» della piattaforma RC2."},{"type":"p","text":"Stato del documento: consolidamento interno di copertura; non costituisce validazione scientifica indipendente né prova delle ore nominali."}],"source_status":"Testo riconciliato Gate 0; controllo scientifico indipendente aperto","qa_status":"NON APPROVATO: richiede audit e collaudo"},{"id":"F01.02","title":"Dati, addestramento e inferenza","hours_nominal":1.5,"source_file":"contenuti/F01.02.docx","sha256":"942588921a4e5f377c882c37bc4527f7e449898a0eb15cebe5a1752b9f59fa07","blocks":[{"type":"h","text":"F01.02 — Dati, addestramento e inferenza"},{"type":"p","text":"Versione di lavoro per riesame · Testo didattico consolidato · 12 ottobre 2026"},{"type":"h","text":"Lezione"},{"type":"p","text":"F01.02 | Dati, addestramento e inferenza"},{"type":"h","text":"Risultati e percorso di studio"},{"type":"p","text":"Descrivere il ciclo di sviluppo di un modello ML: obiettivo, dati, training, validation, test e inferenza."},{"type":"p","text":"Individuare problemi di rappresentatività, etichette, duplicati, leakage e cambiamento del contesto."},{"type":"p","text":"Calcolare e interpretare accuracy, precision e recall da una matrice di confusione."},{"type":"p","text":"Proporre controlli tecnici e organizzativi pertinenti al costo degli errori."},{"type":"p","text":"Sequenza suggerita: 15 min dati → 20 min ciclo ML → 20 min esempio numerico → 20 min laboratorio → 10 min quiz → 5 min riflessione. Il laboratorio può proseguire come compito autonomo."},{"type":"h","text":"1. I dati rappresentano una parte della realtà, non tutta la realtà"},{"type":"p","text":"Un dataset contiene osservazioni raccolte per una finalità. Ogni campo è il risultato di una definizione: «urgenza», «ritardo» e «pratica completata» possono avere significati amministrativi differenti. La validità dei dati dipende dalla domanda a cui risponderemo e dalla popolazione sulla quale il modello opererà. Nessun file è «buono» in assoluto: può essere completo ma non aggiornato o accurato ma relativo a un solo tipo di ente."},{"type":"p","text":"Le sei verifiche minime"},{"type":"h","text":"2. Dal problema al modello: sei fasi diverse"},{"type":"p","text":"1) Definizione del compito: ad esempio individuare richieste che necessitano attenzione rapida, senza delegare automaticamente decisioni amministrative. 2) Raccolta e preparazione: selezione, pulizia, documentazione, verifica liceità d’uso. 3) Training: un algoritmo ottimizza parametri a partire dai dati disponibili. 4) Validation: si confrontano alternative e iperparametri su dati non utilizzati per stimare direttamente i parametri. 5) Test: si valuta il modello finale su dati tenuti separati dalle scelte di sviluppo. 6) Inferenza: si applica il modello a nuovi input, con controlli operativi e monitoraggio."},{"type":"p","text":"Il modello può essere fisso durante l’inferenza: utilizza ciò che ha appreso, senza aggiornarsi per ogni nuovo caso. La separazione training/validation/test non è una garanzia automatica; conta anche come i dati sono suddivisi. Se lo stesso cittadino, procedimento o documento compare quasi identico in training e test, la stima delle prestazioni può risultare ottimistica."},{"type":"h","text":"3. Generalizzazione, overfitting e leakage"},{"type":"p","text":"Un modello che ottiene quasi 100% sul training ma risultati scarsi su pratiche nuove può aver imparato specificità non generalizzabili (overfitting). Il data leakage accade quando informazioni non legittimamente disponibili al momento della previsione entrano negli input o quando si contaminano training e test. Un campo «esito finale» aggiunto solo dopo la lavorazione non può essere usato per prevedere l’esito all’arrivo della richiesta. Anche calcolare statistiche di normalizzazione o imputazione sull’intero dataset prima dello split può far trapelare informazione dal test."},{"type":"p","text":"Per pratiche nel tempo, una verifica particolarmente realistica usa dati di periodi successivi come test. Se cambiano moduli, uffici o regole di priorità, si possono osservare fenomeni di data drift (cambiamento della distribuzione degli input) o concept drift (cambiamento della relazione fra input e risultato). Non sono sinonimi."},{"type":"h","text":"4. Matrice di confusione: esempio svolto"},{"type":"p","text":"Scenario sintetico: su 200 pratiche nuove, 20 sono realmente urgenti e 180 non urgenti. Il sistema segnala «urgente» per 30 pratiche: 15 sono davvero urgenti, 15 non lo sono. Delle restanti 170, 5 sono urgenti sfuggite al sistema e 165 non urgenti."},{"type":"p","text":"Accuracy = (TP + TN) / N = (15 + 165) / 200 = 90%. Precision = TP / (TP + FP) = 15/30 = 50%. Recall (sensibilità) = TP / (TP + FN) = 15/20 = 75%. Sono tre risposte a domande diverse: quanti casi sono classificati correttamente in totale? Quante segnalazioni sono vere? Quante urgenze reali intercettiamo?"},{"type":"p","text":"Il modello banale che dice sempre «non urgente» avrebbe accuracy 180/200 = 90%, come il modello sopra, ma recall sulle urgenze 0%. Questo non rende automaticamente buono il primo modello: se perdere cinque urgenze causa danni gravi, il 75% di recall può essere insufficiente. Bisogna concordare con i responsabili del procedimento costi, priorità, soglie, procedure di escalation e supervisione. La precision non è 15/20: quel rapporto è la recall."},{"type":"p","text":"Errori e conseguenze"},{"type":"h","text":"5. Laboratorio su dati sintetici: il Comune Delta"},{"type":"p","text":"Il Comune Delta sperimenta un modello di triage documentale. Un report interno segnala: 96% di accuracy; 10% di recall sulle urgenze; 70% dei casi provengono da un solo ufficio; solo il 3% delle pratiche è urgente; 18% delle etichette campionate è incoerente tra due operatori; il campo «priorità confermata» viene popolato dopo la revisione; a giugno entra in uso un nuovo portale. Questi valori sono inventati e sono usati esclusivamente per esercizio."},{"type":"p","text":"Consegna: produci una scheda di massimo 2 pagine con almeno cinque criticità, un ordine motivato delle priorità, due metriche oltre all’accuracy e un protocollo di validazione prima del rilascio. Non usare dati personali reali nel laboratorio. Distingui sempre i problemi dimostrati dai problemi sospettati."},{"type":"h","text":"6. Esercizi di consolidamento"},{"type":"p","text":"Esercizio A. Per un sistema con TP=24, FP=16, FN=6, TN=154, calcola accuracy, precision e recall, esplicitando il denominatore."},{"type":"p","text":"Esercizio B. Un modello è valutato sullo stesso periodo e sugli stessi clienti presenti nel training. Descrivi due possibili fonti di ottimismo e una strategia di splitting migliore."},{"type":"p","text":"Esercizio C. Dopo una riforma delle procedure, alcune etichette cambiano significato. Spiega perché non basta monitorare soltanto il numero di richieste ricevute."},{"type":"p","text":"Esercizio D. Proponi una procedura di controllo umano che non si limiti a una firma finale."},{"type":"h","text":"7. Verifica breve e riflessione"},{"type":"h","text":"1. Qual è la differenza tra training e inferenza?"},{"type":"h","text":"2. Qual è il ruolo distinto dei dati di validation e test?"},{"type":"h","text":"3. Perché un campo compilato dopo la decisione può causare leakage?"},{"type":"h","text":"4. Un’accuracy elevata garantisce una recall elevata sulle classi rare? Motiva."},{"type":"h","text":"5. Come distingueresti data drift da concept drift nel Comune Delta?"},{"type":"p","text":"Consegna finale: laboratorio Comune Delta + esercizio A con passaggi + risposte alle cinque domande. La rubrica e le risposte sono riservate alla guida docente; l’autovalutazione dovrebbe confrontare il tuo ragionamento con i criteri, non soltanto con un numero."},{"type":"h","text":"Riferimenti essenziali e controllo delle fonti"},{"type":"p","text":"Regolamento (UE) 2024/1689, art. 3(1) — definizione legale di sistema AI: https://eur-lex.europa.eu/eli/reg/2024/1689/oj"},{"type":"p","text":"OECD (2024), Explanatory memorandum on the updated OECD definition of an AI system: https://www.oecd.org/en/publications/explanatory-memorandum-on-the-updated-oecd-definition-of-an-ai-system_623da898-en.html"},{"type":"p","text":"Google, Machine Learning Crash Course (per gli approfondimenti ML): https://developers.google.com/machine-learning/crash-course"},{"type":"p","text":"NIST, AI Risk Management Framework 1.0 (contesto di gestione dei rischi): https://www.nist.gov/itl/ai-risk-management-framework"},{"type":"p","text":"Nota editoriale: le citazioni sono presentate come riferimenti da consultare nella versione vigente; le interpretazioni dei casi sono didattiche e non costituiscono consulenza legale. Il materiale non riproduce il testo della UNI 11621-8."},{"type":"h","text":"Precisazione scientifica integrata"},{"type":"p","text":"L’addestramento serve a stimare i parametri; la validazione orienta le decisioni di sviluppo, come la scelta degli iperparametri; il test finale serve a stimare le prestazioni su osservazioni non usate per ottimizzare il modello. La separazione casuale non basta se dati di uno stesso cittadino, pratica o periodo compaiono in più insiemi: occorre separare per entità o nel tempo, quando lo scenario lo richiede. Esempio: classificatore di 1.000 segnalazioni, di cui 50 urgenti. Se predice sempre «non urgente», l’accuracy è 950/1000=95%, ma il recall sulle urgenze è 0/50=0. La misura va accompagnata dalla matrice di confusione, dal costo degli errori e dalla descrizione del campione; il 95% non indica da solo un sistema affidabile."},{"type":"h","text":"Attività di controllo applicativo"},{"type":"p","text":"Su 1.000 pratiche, 50 sono urgenti. Un sistema classifica tutte le pratiche come non urgenti. Calcola TP, FN, FP, TN, accuracy e recall delle urgenze; motiva perché la valutazione operativa non può fermarsi all’accuracy. Proponi un test per gruppi e uno temporale."},{"type":"h","text":"Fonti del controllo mirato"},{"type":"p","text":"Fonti: AIPIA Glossario, voci «addestramento», «accuratezza», «precisione», «richiamo»; calcolo aritmetico indipendente.\nhttps://doi.org/10.5281/zenodo.22690474"},{"type":"p","text":"Avvertenza di audit: la presenza di queste fonti non prova la validità di ogni affermazione presente nell’intera lezione. È richiesto riesame indipendente e misurazione dei tempi."},{"type":"h","text":"8. Stress test degli insiemi di dati (recupero RC2)"},{"type":"p","text":"La separazione casuale tra record non basta quando gli stessi procedimenti, persone o documenti compaiono in più righe. Prima della valutazione individua possibili correlazioni: considera uno split temporale e, quando appropriato, uno split per pratica o gruppo, così da valutare casi davvero nuovi."},{"type":"p","text":"Esercizio numerico: 100 pratiche, 10 urgenti. Il sistema identifica correttamente 7 urgenze e genera 9 falsi allarmi. Calcola TP=7, FN=3, FP=9, TN=81; accuracy=(7+81)/100=88%, precision=7/(7+9)=43,75%, recall=7/(7+3)=70%. Spiega perché le metriche descrivono aspetti diversi e come cambierebbe la decisione se il costo dei falsi negativi fosse elevato."},{"type":"p","text":"Confronto fra classificatori: su 1.000 pratiche con 50 urgenze, il sistema A riconosce 40 urgenze e produce 20 falsi allarmi (precision=40/60≈66,7%, recall=40/50=80%). Il sistema B riconosce 47 urgenze e produce 100 falsi allarmi (precision=47/147≈32,0%, recall=47/50=94%). Non c’è una scelta automatica: discuti capacità degli operatori, danni da urgenze perse e costo delle verifiche."},{"type":"p","text":"Nota di provenienza: recuperati i casi distinti «La separazione dei dati è una questione temporale», «Esempio svolto — precision, recall e base rate», «Esercizio di verifica operativa» e «Applicazione numerica e controllo dei dati» dalla piattaforma RC2. Le cifre sono sintetiche."},{"type":"p","text":"Stato del documento: consolidamento interno di copertura; non costituisce validazione scientifica indipendente né prova delle ore nominali."}],"source_status":"Testo riconciliato Gate 0; controllo scientifico indipendente aperto","qa_status":"NON APPROVATO: richiede audit e collaudo"},{"id":"F01.03","title":"Modelli linguistici e multimodali","hours_nominal":2,"source_file":"contenuti/F01.03.docx","sha256":"96398eece1455ce5ada47c8c856f4fd46224e14d257c839bb395b9aab610ae02","blocks":[{"type":"h","text":"F01.03 — Modelli linguistici e multimodali"},{"type":"p","text":"Versione di lavoro per riesame · Testo didattico consolidato · 12 ottobre 2026"},{"type":"h","text":"Lezione"},{"type":"p","text":"F01.03 — Modelli linguistici e multimodali"},{"type":"p","text":"Obiettivo verificabile: Distinguere modello, sistema, modalità e architettura di uso; scegliere un modello considerando dati e limiti."},{"type":"h","text":"Lezione: contenuti"},{"type":"h","text":"1. Dal dato al modello linguistico"},{"type":"p","text":"Un modello linguistico è un sistema statistico addestrato a stimare sequenze di unità testuali (token). In fase di addestramento i parametri sono ottimizzati su esempi; in fase di inferenza il modello produce token sulla base del contesto e delle impostazioni. Non consulta automaticamente fonti aggiornate: l’accesso a un archivio, a Internet o a un database richiede strumenti o integrazioni apposite. Il testo plausibile non costituisce una prova di verità."},{"type":"h","text":"2. Token, contesto e generazione"},{"type":"p","text":"Un token può essere una parola, una parte di parola o un segno. La finestra di contesto delimita la quantità di informazione disponibile per una richiesta e non coincide con una memoria affidabile e illimitata. Temperatura e altre impostazioni influenzano la distribuzione delle risposte; abbassare la variabilità non garantisce accuratezza. La richiesta va progettata considerando lunghezza, costo, latenza e riservatezza."},{"type":"h","text":"3. I transformer in termini comprensibili"},{"type":"p","text":"L’architettura transformer utilizza meccanismi di attenzione che pesano relazioni tra elementi di una sequenza e consente elaborazioni efficienti durante l’addestramento. Questa descrizione non implica che il modello comprenda il testo come un essere umano. Le risposte possono essere coerenti sintatticamente ma inesatte nei dettagli, nei calcoli o nelle citazioni."},{"type":"h","text":"4. Modelli multimodali"},{"type":"p","text":"Un sistema multimodale può accettare e/o produrre più tipi di dati: testo, immagini, audio o video. Le modalità disponibili dipendono dal modello e dall’interfaccia. Interpretare una tabella in una fotografia richiede attenzione a qualità, orientamento e leggibilità; nessuna elaborazione sostituisce la verifica sul documento originale."},{"type":"h","text":"5. LLM, RAG, fine-tuning e strumenti"},{"type":"p","text":"Un LLM isolato genera risposte dal contesto e dalla conoscenza appresa. Con RAG si recuperano passaggi da una base documentale e li si fornisce al modello; questo può migliorare la verificabilità, ma può fallire se i documenti recuperati sono sbagliati. Il fine-tuning modifica parametri tramite dati di addestramento mirati; non è un sostituto automatico della ricerca di fonti. Con tool calling, invece, il modello richiede l’uso di strumenti esterni: la loro esecuzione deve essere controllata."},{"type":"h","text":"6. La scelta della soluzione"},{"type":"p","text":"Un consulente deve domandare: quali documenti useremo, chi li aggiorna, quale livello di accuratezza è richiesto, dove vengono trattati i dati e chi valida l’output? Un modello generale con RAG può essere più adatto di un addestramento personalizzato quando il corpus normativo cambia frequentemente, ma occorrono test comparativi e valutazione dei costi."},{"type":"h","text":"Caso guidato: ricerca documentale del Comune Delta"},{"type":"p","text":"L’ufficio tecnico dispone di 6.000 determine in PDF e desidera interrogare l’archivio. Proposta iniziale: estrazione e controllo dei testi, metadati e permessi, indicizzazione, recupero dei documenti rilevanti, risposta con rinvio alle fonti, verifica umana. Prima di adottare RAG misurare copertura del recupero, fedeltà delle citazioni, errori e tempi di risposta."},{"type":"h","text":"Esercizio"},{"type":"p","text":"Un fornitore propone di “addestrare il chatbot con tutte le determine” senza specificare se userà RAG o fine-tuning. Formula sei domande tecniche e organizzative; identifica due rischi di riservatezza e due prove di accettazione."},{"type":"p","text":"Esempio guidato con decisioni motivate"},{"type":"p","text":"Confronto: (A) modello linguistico isolato e (B) sistema con recupero documentale. Se la domanda è «quale determina del 2025 disciplina il procedimento?», A può rispondere per plausibilità senza prova; B deve fornire documento e passaggio. In entrambi i casi un operatore deve verificare citazione e vigenza. La decisione di usare B si basa su test del recupero, non su una promessa del vendor."},{"type":"p","text":"Errori frequenti e correzioni"},{"type":"p","text":"• Confondere il modello con il sistema che lo ospita — occorre dichiarare il limite e la verifica necessaria."},{"type":"p","text":"• Assumere che RAG garantisca sempre verità — occorre dichiarare il limite e la verifica necessaria."},{"type":"p","text":"Checklist applicativa per lo studente"},{"type":"p","text":"☐ Ho identificato che cosa è noto e che cosa sto ipotizzando."},{"type":"p","text":"☐ Ho indicato il criterio con cui valuterò il risultato."},{"type":"p","text":"☐ Ho previsto una verifica umana proporzionata al rischio."},{"type":"p","text":"☐ Ho distinto la fonte primaria dalla spiegazione didattica."},{"type":"p","text":"☐ So spiegare un errore possibile e una misura di controllo."},{"type":"h","text":"Trasferimento nel lavoro reale"},{"type":"p","text":"Prima di scegliere un prodotto, costruisci una tabella con requisiti del compito, corpus disponibile, protezione dati, costo, accuratezza, tracciabilità delle fonti e soglie di accettazione."},{"type":"h","text":"Domande di autoverifica"},{"type":"h","text":"1. Un LLM isolato consulta automaticamente la legislazione aggiornata?"},{"type":"h","text":"2. Perché RAG non elimina le allucinazioni?"},{"type":"h","text":"3. Qual è la differenza tra modello multimodale e archivio documentale?"},{"type":"h","text":"Criteri di valutazione"},{"type":"p","text":"Conoscenze e concetti: 30%; applicazione al caso: 35%; valutazione dei rischi e controlli: 25%; chiarezza e limiti esplicitati: 10%. Proposta interna; le risposte aperte richiedono correzione umana. Soglia esplorativa: 70/100, da validare con i tester."},{"type":"h","text":"Fonti e letture di riferimento"},{"type":"p","text":"• Regolamento (UE) 2024/1689, art. 3 e definizioni: https://eur-lex.europa.eu/eli/reg/2024/1689/oj"},{"type":"p","text":"• Vaswani et al., Attention Is All You Need (2017), arXiv:1706.03762"},{"type":"p","text":"• Lewis et al., Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (2020), arXiv:2005.11401"},{"type":"h","text":"Precisazione scientifica integrata"},{"type":"p","text":"Un sistema RAG recupera documenti pertinenti e li rende disponibili al modello durante la generazione. Il recupero può ridurre il numero di affermazioni prive di supporto, ma non garantisce che il documento recuperato sia attendibile, aggiornato o correttamente interpretato. Una citazione formalmente plausibile può riferirsi a una fonte che non sostiene il passaggio. Nel laboratorio il discente deve quindi distinguere tre verifiche: (1) la fonte esiste ed è la versione corretta; (2) il passaggio citato sostiene precisamente l’affermazione; (3) la sintesi non omette condizioni o eccezioni sostanziali. Se una verifica fallisce, l’output è da correggere prima dell’uso, anche quando il testo è grammaticalmente perfetto."},{"type":"h","text":"Attività di controllo applicativo"},{"type":"p","text":"Verifica una risposta RAG che cita tre documenti: per ogni proposizione controlla identificativo della fonte, data/versione, passo che la supporta e omissioni. Distingui fonte inesistente, fonte esistente ma non pertinente e sintesi incompleta."},{"type":"h","text":"Fonti del controllo mirato"},{"type":"p","text":"Fonte metodologica: NIST AI 600-1, profilo generative AI, rischi di confabulazione e validità degli output; integrazione editoriale da valutare.\nhttps://doi.org/10.6028/NIST.AI.600-1"},{"type":"p","text":"Avvertenza di audit: la presenza di queste fonti non prova la validità di ogni affermazione presente nell’intera lezione. È richiesto riesame indipendente e misurazione dei tempi."},{"type":"h","text":"Integrazioni Gate 0 — riconciliazione sostanziale"},{"type":"p","text":"Le attività seguenti recuperano contenuti applicativi presenti nella piattaforma RC2 e compressi nel Word. Sono prove didattiche progettate, non evidenze di efficacia già misurata."},{"type":"h","text":"7. Scelta fra quattro architetture: matrice comparativa"},{"type":"p","text":"Confronta quattro opzioni per rispondere alle domande sulle determine del Comune Delta: (A) ricerca testuale tradizionale, (B) LLM isolato, (C) LLM con recupero documentale (RAG), (D) workflow ibrido con recupero, controlli deterministici e approvazione umana. Per ogni opzione compila una matrice con: tipologia della domanda, fonti accessibili, rischio di riferimento inesistente, aggiornamento, costo operativo, tracciabilità, requisiti sui permessi e verifica prima dell’uso. Non dichiarare una soluzione vincente senza risultati di test su domande rappresentative."},{"type":"h","text":"8. Audit delle citazioni: prova riproducibile"},{"type":"p","text":"Su cinque affermazioni generate, registra: testo preciso dell’affermazione, riferimento dichiarato, identificativo e versione del documento, passaggio originale citato, giudizio «supportata / parzialmente supportata / non supportata / non verificabile» e azione correttiva. Un collegamento alla fonte non dimostra che la fonte contenga la proposizione. Un recupero pertinente può comunque essere incompleto, superato o citato in modo distorto. L’accessibilità dei documenti deve rispettare i permessi degli utenti."},{"type":"h","text":"9. Prova controfattuale e limite multimodale"},{"type":"p","text":"Per la stessa domanda, confronta una risposta plausibile ma priva di fonte, una risposta con link generico e una risposta con estratto verificabile. Indica quale evidenza potrebbe falsificare ciascuna risposta. Poi considera una determina scansionata con data o importo poco leggibile: segnala il campo dubbio, verifica sull’immagine originale o su un secondo controllo documentale e non completare per congettura. Distingui multimodalità (forme dei dati), uso di strumenti (azioni esterne) e RAG (recupero documentale): sono proprietà diverse che possono combinarsi."},{"type":"h","text":"Nota editoriale e limiti del riesame"},{"type":"p","text":"Non sono state reintegrate le cronologie RC1/RC2, le duplicazioni delle definizioni o le dichiarazioni di audit. L’inserimento non convalida ogni proposizione del testo né i tempi nominali: restano necessarie verifica puntuale delle fonti, revisione indipendente e collaudo didattico."}],"source_status":"Testo riconciliato Gate 0; controllo scientifico indipendente aperto","qa_status":"NON APPROVATO: richiede audit e collaudo"},{"id":"F01.04","title":"Istruzioni e collaborazione uomo–AI","hours_nominal":2,"source_file":"contenuti/F01.04.docx","sha256":"788667acd44ce026b1116d2dc3f5932ca54d1da345708b814fbff6e0168806a6","blocks":[{"type":"h","text":"F01.04 — Istruzioni e collaborazione uomo–AI"},{"type":"p","text":"Versione di lavoro per riesame · Testo didattico consolidato · 12 ottobre 2026"},{"type":"h","text":"Lezione"},{"type":"p","text":"F01.04 — Istruzioni e collaborazione uomo–AI"},{"type":"p","text":"Obiettivo verificabile: Progettare istruzioni riproducibili, definire controlli e documentare collaborazione e responsabilità umane."},{"type":"h","text":"Lezione: contenuti"},{"type":"h","text":"1. Dal quesito vago alla specifica"},{"type":"p","text":"Una richiesta utile chiarisce obiettivo, destinatario, input autorizzati, criteri di qualità, formato di output, vincoli e comportamenti in caso di incertezza. Non è necessario scrivere prompt lunghi: serve rendere verificabili i requisiti. Un prompt è un’interfaccia operativa con il modello, non una garanzia di correttezza."},{"type":"h","text":"2. Contesto e gerarchia delle istruzioni"},{"type":"p","text":"Nei sistemi basati su LLM le istruzioni di livelli diversi e i testi recuperati svolgono ruoli differenti. Un documento esterno può contenere indicazioni malevole: va trattato come dato, non come autorità. Le regole applicative e i permessi devono essere implementati nel software e nei controlli organizzativi, non affidati unicamente a frasi nel prompt."},{"type":"h","text":"3. Strutturare gli output"},{"type":"p","text":"Per una bozza amministrativa si può richiedere una scheda con: fatti forniti, fatti da verificare, fonti citate con riferimento puntuale, proposta di testo, limiti e checklist. Per flussi automatici si può richiedere JSON con uno schema definito, validando sintassi, tipi e campi obbligatori. Il rispetto del formato non prova la correttezza dei contenuti."},{"type":"h","text":"4. Human-in-the-loop"},{"type":"p","text":"La supervisione deve prevedere interventi reali: autorizzazione degli input, controllo dei riferimenti, verifica dei calcoli, decisione di accettare o respingere, tracciamento delle modifiche. La firma del professionista non rende affidabile una bozza non verificata. La responsabilità giuridica concreta dipende dal ruolo e dalla disciplina applicabile."},{"type":"h","text":"5. Valutazione e miglioramento"},{"type":"p","text":"Creare un set di casi rappresentativi e difficili, definire una rubrica, confrontare versioni del prompt, registrare gli errori e fermare l’uso quando mancano dati essenziali. Testare anche casi in cui il sistema deve rispondere “non posso determinarlo”. Evitare il test su un solo esempio riuscito: non generalizza."},{"type":"h","text":"6. Trasparenza verso l’utente"},{"type":"p","text":"Dichiarare quando un testo è generato con assistenza AI, quali controlli sono stati eseguiti e chi può approvarlo. Nei documenti per la PA tenere distinti: bozza generata, bozza revisionata, documento validato e atto formalmente adottato dall’amministrazione."},{"type":"h","text":"Caso guidato: bozza di determina"},{"type":"p","text":"Input: richiesta dell’ufficio, dati amministrativi fittizi e allegati autorizzati. Il prompt deve produrre una bozza con sezioni identificate e un registro dei punti non verificati; se manca il riferimento al finanziamento il sistema deve segnalarlo, non inventarlo. Il professionista confronta ogni riferimento con la fonte ufficiale."},{"type":"h","text":"Laboratorio"},{"type":"p","text":"Scrivi un prompt per una scheda istruttoria RUP che separi: fatti documentati, dati mancanti, controlli, bozza e fonti. Crea cinque test, tra cui un allegato con istruzioni malevole e un riferimento normativo inventato."},{"type":"p","text":"Esempio guidato con decisioni motivate"},{"type":"p","text":"Input incompleto: «scrivi la determina urgente». Risposta attesa: non inventare oggetto, base giuridica, copertura e riferimenti; chiedere dati mancanti. Esempio di output: FATTI VERIFICATI: nessuno; DATI MANCANTI: oggetto e capitolo; BOZZA: sospesa; CONTROLLO UMANO: obbligatorio. Si testa su casi incompleti e contraddittori."},{"type":"p","text":"Errori frequenti e correzioni"},{"type":"p","text":"• Confondere la forma corretta con l’esattezza dei fatti — occorre dichiarare il limite e la verifica necessaria."},{"type":"p","text":"• Considerare un documento recuperato come istruzione autorevole — occorre dichiarare il limite e la verifica necessaria."},{"type":"p","text":"Checklist applicativa per lo studente"},{"type":"p","text":"☐ Ho identificato che cosa è noto e che cosa sto ipotizzando."},{"type":"p","text":"☐ Ho indicato il criterio con cui valuterò il risultato."},{"type":"p","text":"☐ Ho previsto una verifica umana proporzionata al rischio."},{"type":"p","text":"☐ Ho distinto la fonte primaria dalla spiegazione didattica."},{"type":"p","text":"☐ So spiegare un errore possibile e una misura di controllo."},{"type":"h","text":"Trasferimento nel lavoro reale"},{"type":"p","text":"Per ogni workflow documentale conserva versione del prompt, input fittizi di collaudo, scheda delle verifiche, anomalie note e revisore incaricato."},{"type":"h","text":"Domande di autoverifica"},{"type":"h","text":"1. Un output JSON valido è necessariamente corretto?"},{"type":"h","text":"2. Perché una fonte recuperata non deve dettare nuove regole al sistema?"},{"type":"h","text":"3. Quando è significativo il controllo umano?"},{"type":"h","text":"Criteri di valutazione"},{"type":"p","text":"Conoscenze e concetti: 30%; applicazione al caso: 35%; valutazione dei rischi e controlli: 25%; chiarezza e limiti esplicitati: 10%. Proposta interna; le risposte aperte richiedono correzione umana. Soglia esplorativa: 70/100, da validare con i tester."},{"type":"h","text":"Fonti e letture di riferimento"},{"type":"p","text":"• NIST AI RMF 1.0 (2023): https://www.nist.gov/itl/ai-risk-management-framework"},{"type":"p","text":"• OWASP Top 10 for LLM Applications: https://genai.owasp.org/"},{"type":"p","text":"• Regolamento (UE) 2024/1689, obblighi pertinenti e supervisione umana: https://eur-lex.europa.eu/eli/reg/2024/1689/oj"},{"type":"h","text":"Precisazione scientifica integrata"},{"type":"p","text":"Un prompt ben strutturato dovrebbe specificare obiettivo, contesto, vincoli, fonti ammesse, formato d’uscita e criteri di verifica. Non basta però inserire la formula «un umano controlla»: occorre descrivere chi decide, quali informazioni può esaminare, quando può intervenire, se può rifiutare l’output e come documenta l’esito. Esercizio: una bozza di determina è prodotta automaticamente; il responsabile riceve solo il documento finale e un pulsante «approva». Il discente deve proporre una procedura che mostri le fonti, separi i dati di fatto dalle conclusioni, renda esplicite le incertezze e consenta correzione prima della firma. Le prescrizioni specifiche dell’art. 14 dell’AI Act riguardano i sistemi ad alto rischio: non vanno presentate indistintamente come obbligo di ogni uso generativo."},{"type":"h","text":"Attività di controllo applicativo"},{"type":"p","text":"Progetta la procedura per una bozza amministrativa: input consentiti, struttura del prompt, fonti di riferimento, output strutturato, controlli di autorizzazione, verifiche umane e registrazione dell’approvazione. Identifica due attacchi tramite documenti non attendibili."},{"type":"h","text":"Fonti del controllo mirato"},{"type":"p","text":"Fonte normativa: Regolamento (UE) 2024/1689, art. 14, con perimetro applicativo; fonte metodologica: NIST AI RMF.\nhttps://ai-act-service-desk.ec.europa.eu/en/ai-act/article-14"},{"type":"p","text":"Avvertenza di audit: la presenza di queste fonti non prova la validità di ogni affermazione presente nell’intera lezione. È richiesto riesame indipendente e misurazione dei tempi."},{"type":"h","text":"Integrazioni Gate 0 — riconciliazione sostanziale"},{"type":"p","text":"Le attività seguenti recuperano contenuti applicativi presenti nella piattaforma RC2 e compressi nel Word. Sono prove didattiche progettate, non evidenze di efficacia già misurata."},{"type":"h","text":"7. Sei test di regressione prima dell’uso"},{"type":"p","text":"Predisponi una tabella con colonne ID, scenario, input sintetico autorizzato, comportamento atteso, esito osservato, evidenza e azione correttiva. Esegui sei prove: pratica completa; allegato mancante; importi discordanti; riferimento normativo non verificabile; documento contenente «ignora le istruzioni precedenti»; richiesta di redigere un atto senza indicazione del soggetto competente. Non affidare al solo testo del prompt la protezione dalle istruzioni presenti nei documenti."},{"type":"h","text":"8. Tre iterazioni e confronto controllato"},{"type":"p","text":"Parti dal prompt v1 «Prepara una determina». In v2 inserisci scopo, destinatario, fonti ammesse, campi obbligatori e comportamento in presenza di dati mancanti. In v3 richiedi un output strutturato con fatti documentati, dati incerti, riferimenti puntuali, bozza separata e checklist di approvazione. Testa le tre versioni sugli stessi sei casi; misura omissioni, riferimenti non supportati, gestione dell’incertezza e necessità di correzione umana. Una forma JSON valida non prova che i contenuti siano veri."},{"type":"h","text":"9. Matrice dei ruoli e controlli applicativi"},{"type":"p","text":"Disegna il flusso dalla ricezione dell’allegato all’eventuale firma: stabilisci chi è autorizzato a inserire dati, chi verifica fonti e numeri, chi approva e chi ha il potere di firma. I controlli di identità, permessi di accesso e disponibilità degli strumenti devono essere attuati nell’applicazione e nei servizi, non delegati al prompt. Introduci una condizione di arresto se mancano base documentale, titolarità dell’azione o verifica dei dati essenziali. Conserva un registro sintetico delle revisioni senza acquisire inutilmente dati personali."},{"type":"h","text":"Nota editoriale e limiti del riesame"},{"type":"p","text":"Non sono state reintegrate le cronologie RC1/RC2, le duplicazioni delle definizioni o le dichiarazioni di audit. L’inserimento non convalida ogni proposizione del testo né i tempi nominali: restano necessarie verifica puntuale delle fonti, revisione indipendente e collaudo didattico."}],"source_status":"Testo riconciliato Gate 0; controllo scientifico indipendente aperto","qa_status":"NON APPROVATO: richiede audit e collaudo"},{"id":"F01.05","title":"Rischi, errori e sicurezza","hours_nominal":2,"source_file":"contenuti/F01.05.docx","sha256":"472583cd0d347e512cfd6227573818a6251caefa705430cf682d414963db59e0","blocks":[{"type":"h","text":"F01.05 — Rischi, errori e sicurezza"},{"type":"p","text":"Lezione consolidata per lo studio · Audit scientifico interno · 12 ottobre 2026"},{"type":"p","text":"Stato: testo revisionato; non sottoposto a revisione indipendente. Durata nominale 120 minuti, non misurata. I casi e i dati sono sintetici."},{"type":"h","text":"Obiettivi di apprendimento"},{"type":"p","text":"Al termine dell’unità, lo studente deve saper distinguere almeno quattro meccanismi di rischio, descrivere l’evento indesiderato e le sue conseguenze, progettare controlli preventivi e di rilevazione, valutare il rischio residuo e motivare quando sospendere l’uso del sistema. Non è richiesto memorizzare una lista di slogan: conta la capacità di giustificare i controlli in un caso nuovo."},{"type":"h","text":"1. Dal risultato plausibile al rischio reale"},{"type":"p","text":"Un output fluido e convincente non dimostra che sia corretto. Per esempio, un assistente può citare una disposizione inesistente oppure riportare correttamente un articolo ormai superato. L’errore tecnico diventa un rischio organizzativo quando una persona incorpora l’affermazione in una decisione senza controllarla. Il NIST AI RMF è un quadro volontario per governare, mappare, misurare e gestire i rischi: non è una legge né una prova automatica di conformità. [S1, S2]"},{"type":"p","text":"La parola “allucinazione” è diffusa, ma non equivale a qualunque fallimento: omissioni, classificazioni scorrette, divulgazione di dati e azioni non autorizzate hanno meccanismi differenti. Il profilo NIST per l’IA generativa descrive, fra gli altri, confabulazione, rischi per la privacy e distorsioni dannose. [S2]"},{"type":"h","text":"2. Quattro meccanismi da distinguere"},{"type":"p","text":"(A) Errore fattuale: l’output contiene un fatto, un calcolo o un riferimento non supportato. (B) Prompt injection: contenuti esterni non attendibili tentano di trasformarsi in istruzioni per l’assistente. (C) Violazione di riservatezza: dati personali o aziendali vengono comunicati o trattati senza autorizzazione adeguata. (D) Distorsione dell’automazione: l’operatore si affida eccessivamente all’output, invece di esercitare il controllo previsto. Lo stesso incidente può combinarne più di uno; attribuire tutto alle “allucinazioni” ostacola l’individuazione della contromisura corretta. [S2, S3, S4]"},{"type":"h","text":"3. Verificare i fatti non significa controllare solo lo stile"},{"type":"p","text":"Per una bozza normativa o amministrativa, identificare ogni affermazione verificabile, recuperare la fonte originale, controllarne esistenza, versione, data e ambito di applicazione, confrontare i numeri e annotare l’esito. Se la fonte non è disponibile, la risposta va indicata come non verificata; la richiesta di una formulazione “più sicura” al modello non risolve il problema. Per i casi critici definire campioni di verifica, criteri d’errore e un punto di arresto prima della consegna. [S1, S2]"},{"type":"h","text":"4. Dati sbilanciati, metriche e danni"},{"type":"p","text":"La distinzione tecnica fra accuracy, precision e recall è trattata in F01.02. Qui interessa la conseguenza: un classificatore che riconosce male le richieste urgenti può sembrare ottimo in media quando le urgenze sono rare. Non si può dedurre il recall da un’accuracy isolata. Per decidere sull’uso servono una matrice di confusione su un insieme di prova rappresentativo, un’analisi dei falsi negativi e una procedura per le situazioni in cui il sistema non è affidabile. Il fatto che un test abbia dato buone prestazioni non garantisce lo stesso risultato su uffici, periodi o utenti differenti. [S1]"},{"type":"p","text":"Caso illustrativo, NON dato osservato: un sistema assegna bassa priorità a una segnalazione realmente urgente; l’operatore accetta l’indicazione senza leggere gli elementi disponibili. Il rischio nasce dall’errore del classificatore e dall’eccessivo affidamento umano. Servono rilevazione delle urgenze mancate, percorso di escalation, potere reale di correggere la priorità e monitoraggio degli incidenti."},{"type":"h","text":"5. Documenti ostili e confine fra dati e comandi"},{"type":"p","text":"Un documento recuperato, una pagina web o un’e-mail possono contenere testo del tipo «ignora le istruzioni precedenti». All’interno di quel documento la frase è un dato, non un ordine legittimo. Se l’assistente la tratta come istruzione, il confine di fiducia è stato oltrepassato. OWASP descrive il prompt injection come categoria di rischio per applicazioni basate su modelli linguistici. Le difese includono permessi minimi per gli strumenti, separazione delle sorgenti non attendibili, validazione degli output e approvazione indipendente delle azioni sensibili. Nessun singolo filtro, e neppure un prompt “rinforzato”, garantisce di prevenire tutti gli attacchi. [S3]"},{"type":"h","text":"6. Privacy, confidenzialità e protezione dei dati"},{"type":"p","text":"Prima di trasferire a un sistema esterno documenti contenenti dati personali occorre determinare finalità, base giuridica e necessità del trattamento, minimizzare i dati, valutare il ruolo del fornitore e applicare le misure di sicurezza pertinenti. Nel GDPR il principio di minimizzazione compare all’articolo 5, le basi di liceità all’articolo 6 e la sicurezza del trattamento all’articolo 32. Non sono passaggi intercambiabili: disporre di una base giuridica non elimina il dovere di proteggere i dati. Eliminare solo il nome non garantisce anonimato: dettagli combinabili possono permettere la reidentificazione. [S5]"},{"type":"h","text":"7. Controlli proporzionati e sorveglianza umana"},{"type":"p","text":"Un registro utile dei rischi identifica scenario, condizioni di insorgenza, persone o processi esposti, probabilità e gravità stimate, misure preventive, modalità di rilevazione, soggetto responsabile, escalation e rischio residuo. Le stime qualitative devono indicare le assunzioni: “alta probabilità” senza dati o motivazione non è una misura. Per i sistemi di IA ad alto rischio, l’articolo 14 dell’AI Act prevede requisiti specifici di sorveglianza umana commisurati a rischio, autonomia e contesto. Non bisogna attribuire indiscriminatamente gli stessi obblighi giuridici a qualunque assistente. [S1, S4]"},{"type":"p","text":"Una supervisione solo nominale è debole: chi controlla deve poter comprendere i limiti, ignorare o modificare l’output, intervenire e, ove appropriato, arrestare il sistema. Nella progettazione del flusso documentare chi può prendere ciascuna decisione e che cosa deve succedere quando il controllo fallisce. [S4]"},{"type":"h","text":"8. Valutazione e rischio residuo"},{"type":"p","text":"Un sistema non è “sicuro” perché ha superato pochi esempi dimostrativi. Occorrono prove ordinarie e avverse: documenti mancanti o contraddittori, richieste fuori ambito, contenuti ostili, accessi non autorizzati e condizioni mutate. Registrare il dataset, la versione del modello, le istruzioni, gli strumenti abilitati e i criteri di successo permette di ripetere i test. Il rischio residuo è ciò che rimane dopo i controlli e deve essere esplicitato a chi prende la decisione sull’impiego. [S1, S2, S3]"},{"type":"h","text":"9. Equità, cambiamento dei dati e controlli per sottogruppi"},{"type":"p","text":"Un risultato medio può nascondere differenze rilevanti tra gruppi di utenti, uffici, territori o periodi. Occorre fissare prima della prova quali sottogruppi siano pertinenti, in relazione al contesto d’uso e ai rischi, e confrontare su di essi falsi negativi, falsi positivi e tassi di mancata risposta. Le differenze osservate non provano da sole una discriminazione: richiedono esame di numerosità, qualità delle etichette, rappresentatività, possibile confondimento e conseguenze dell’errore. Non raccogliere categorie particolari di dati personali senza una base giuridica e condizioni applicabili. [S1][S2][S5]"},{"type":"p","text":"Esempio ipotetico: la sensibilità sulle urgenze è 90% nel periodo A e 60% nel periodo B. Se in ciascun periodo vi sono 20 urgenze realmente positive, il sistema ne riconosce rispettivamente 18 e 12. Questo suggerisce una criticità da approfondire, non dimostra che il periodo sia la causa. Occorre controllare campione, etichettatura, mix dei casi, incertezza delle stime e cambiamenti del processo. I calcoli delle metriche sono spiegati in F01.02."},{"type":"h","text":"10. Privacy operativa: conservazione, accessi e fornitori"},{"type":"p","text":"Per un servizio esterno non basta oscurare il nome. Prima dell’uso occorre documentare: finalità e base giuridica; categorie di dati e minimizzazione; ruoli dei soggetti nel trattamento; eventuale accordo ai sensi dell’art. 28 GDPR quando applicabile; accessi e autorizzazioni; tempi di conservazione e cancellazione; eventuali trasferimenti verso paesi terzi e relative condizioni; misure di sicurezza; procedure per incidenti e richieste degli interessati. Un dato pseudonimizzato rimane personale quando la reidentificazione è possibile mediante informazioni aggiuntive. La verifica deve essere contestuale, non risolta con una checklist uguale per ogni servizio. [S5]"},{"type":"h","text":"11. Piano di prove: robustezza, evidenze e incidenti"},{"type":"p","text":"Definire prima dei test: compito e contesto previsto, insieme di casi con etichette controllate, misure per classe o gruppo, criteri di accettazione, responsabile del giudizio e registrazione dei risultati. Includere casi ordinari e casi di stress: campo essenziale assente, allegati contraddittori, formato danneggiato, documento con istruzioni ostili, richieste fuori ambito e tentativi di operare senza autorizzazione. Gli esempi di attacco devono essere sintetici e svolti in ambiente isolato senza dati reali. Nessun singolo insieme di prove garantisce la sicurezza in ogni contesto. [S1][S2][S3]"},{"type":"p","text":"Per ogni incidente o quasi-incidente annotare: identificativo, data, versione del sistema, input trattato senza esporre dati non necessari, output osservato, impatto, individuazione, decisione presa, responsabile, azione correttiva e prova di regressione. Separare le registrazioni tecniche dalle eventuali obbligazioni giuridiche di registrazione e notifica, che dipendono dalla qualificazione del sistema e dalla disciplina applicabile. [S1][S4][S5]"},{"type":"h","text":"12. Decisione operativa: escalation, sospensione e rischio residuo"},{"type":"p","text":"Un controllo efficace identifica chi può correggere un output, chi autorizza una decisione e chi può sospendere il servizio. Stabilire in anticipo soglie legate al danno: per esempio un caso urgente non riconosciuto in una prova controllata comporta l’esame immediato dell’errore, il blocco dell’automatismo nel flusso critico e un nuovo collaudo prima del ripristino, secondo il piano approvato dall’ente. Questa è una scelta cautelativa per il caso didattico, non una soglia prescritta universalmente dalla legge."},{"type":"p","text":"La scheda di rischio residuo deve esplicitare quali rischi permangono, su quali evidenze si fonda la stima, chi può accettarli nell’organizzazione e quando è obbligatorio riesaminarli (nuovo modello, modifica del processo, cambiamento dei dati, incidente o peggioramento degli indicatori). L’accettazione organizzativa del rischio non sostituisce gli obblighi legali. [S1][S4]"},{"type":"h","text":"13. Micro-esercizio di trasferimento"},{"type":"p","text":"L’assistente del Comune Aurora mostra prestazioni inferiori sulle segnalazioni inviate tramite modulo cartaceo rispetto a quelle inserite online. Prepara in non più di 250 parole: (a) due ipotesi alternative che potrebbero spiegare la differenza; (b) tre dati o evidenze da cercare; (c) un controllo preventivo e un test di regressione; (d) una condizione motivata per sospendere l’assegnazione automatica delle priorità. Non concludere che esista discriminazione prima di aver distinto la differenza osservata dalle sue possibili cause."},{"type":"h","text":"Laboratorio — Registro del rischio del Comune Aurora"},{"type":"p","text":"Scenario sintetico. Il Comune usa un assistente per riassumere segnalazioni dei cittadini e proporre una categoria di priorità; la priorità finale resta a un operatore competente. Sono disponibili segnalazioni con testo libero, alcune contenenti dati personali. Un documento recuperato contiene anche istruzioni ostili rivolte all’assistente."},{"type":"p","text":"Consegna: per ciascuno dei quattro scenari — fonte normativa inesatta, urgenza non riconosciuta, divulgazione di dati, prompt injection — compila: (1) evento e impatto; (2) causa plausibile e informazione mancante; (3) controllo preventivo; (4) prova di rilevazione; (5) responsabile e modalità di escalation; (6) criterio di sospensione; (7) rischio residuo. Indica almeno una prova che potrebbe confutare la tua proposta. Usa esclusivamente dati sintetici. Aggiungi un indicatore osservabile, il criterio di escalation e la prova necessaria per riaprire il servizio dopo un incidente. Verifica almeno un sottogruppo o periodo pertinente, quando i dati lo consentono senza trattamenti illeciti."},{"type":"p","text":"Rubrica esplorativa: correttezza dei meccanismi (30 punti); qualità delle prove e dei controlli (30); motivazione delle decisioni e del rischio residuo (25); chiarezza e assunzioni (15). Il punteggio non è una certificazione di competenza e richiede valutazione umana."},{"type":"h","text":"Autoverifica"},{"type":"p","text":"Perché un’accuracy elevata non prova che il sistema rilevi le urgenze?"},{"type":"p","text":"Che differenza esiste fra citazione inventata e prompt injection?"},{"type":"p","text":"Quali verifiche imposteresti prima di caricare dati personali in un servizio esterno?"},{"type":"p","text":"Quando il controllo umano è sostanziale e quando soltanto formale?"},{"type":"p","text":"Quale evidenza richiederesti prima di dichiarare accettabile il rischio residuo?"},{"type":"h","text":"Fonti controllate e ambito di utilizzo"},{"type":"p","text":"[S1] NIST AI Risk Management Framework 1.0 — quadro volontario. https://www.nist.gov/itl/ai-risk-management-framework"},{"type":"p","text":"[S2] NIST AI 600-1 (2024), Generative AI Profile — profilo volontario. https://doi.org/10.6028/NIST.AI.600-1"},{"type":"p","text":"[S3] OWASP, LLM01 Prompt Injection — guida sicurezza, non norma. https://genai.owasp.org/llmrisk/llm01-prompt-injection/"},{"type":"p","text":"[S4] Regolamento (UE) 2024/1689 consolidato, art. 14 — requisiti per sistemi IA ad alto rischio. https://ai-act-service-desk.ec.europa.eu/it/ai-act/article-14"},{"type":"p","text":"[S5] Regolamento (UE) 2016/679, artt. 5, 6, 32 e considerando 26 — norme GDPR. https://eur-lex.europa.eu/eli/reg/2016/679/oj"},{"type":"p","text":"Avvertenza editoriale: la riconduzione del caso didattico a una determinata categoria giuridica richiede una valutazione specifica. Le fonti NIST e OWASP descrivono pratiche raccomandate, non adempimenti automaticamente obbligatori."},{"type":"p","text":"Nota di revisione: reintegrazione dei temi presenti nel testo RC2, senza ripetere il calcolo dettagliato delle metriche di F01.02. La verifica scientifica esterna e la misurazione effettiva delle 120 minuti restano aperte."},{"type":"h","text":"Integrazione Gate 0 — esercitazioni riconciliate"},{"type":"h","text":"Caso di classificazione ingannevole"},{"type":"p","text":"Caso sintetico. Su 1.000 segnalazioni, 50 sono urgenti e 950 non urgenti. Un classificatore che indica sempre «non urgente» totalizza 950 risposte corrette: accuracy 95%, recall della classe urgente 0%. Non può quindi essere accettato per il solo valore di accuracy."},{"type":"p","text":"Compito: indica quale danno deriva dai falsi negativi, quali misure per la classe urgente richiedere (matrice di confusione, recall, precision, numero di casi), quale soglia progettuale vorresti stabilire prima del test e chi autorizzerebbe un eventuale utilizzo. La soglia va motivata, non inventata come standard normativo."},{"type":"h","text":"Stress test sulla catena documentale"},{"type":"p","text":"Prova tre casi sintetici: (A) un allegato contiene istruzioni rivolte al modello; (B) una fonte normativa citata non è rintracciabile; (C) il sistema omette un paragrafo che modifica il significato della richiesta. Per ciascun caso descrivi input, comportamento atteso, segnale di fallimento, intervento umano, registrazione dell’incidente e condizione di ripristino."},{"type":"p","text":"Non introdurre istruzioni d’attacco operative né inserire documenti reali con dati personali nei test didattici. I consigli NIST/OWASP sono riferimenti tecnici: non sono, di per sé, obblighi giuridici generalizzati."},{"type":"p","text":"Nota editoriale: integrazioni didattiche originate dal confronto tra piattaforma e Word precedente; non costituiscono validazione scientifica indipendente."}],"source_status":"Testo riconciliato Gate 0; controllo scientifico indipendente aperto","qa_status":"NON APPROVATO: richiede audit e collaudo"},{"id":"F01.06","title":"Regole, AI Act e responsabilità","hours_nominal":1.5,"source_file":"contenuti/F01.06.docx","sha256":"906778fb670daac4656a336215acb45e12686d051c2cdf52a9a73d05bc30aa08","blocks":[{"type":"h","text":"F01.06 — Regole, AI Act e responsabilità | Testo unificato in audit"},{"type":"h","text":"Obiettivo e confini della lezione"},{"type":"p","text":"Obiettivo: distinguere gli obblighi giuridici dalle buone pratiche di gestione quando un’organizzazione acquisisce o utilizza un sistema di intelligenza artificiale. Alla fine della lezione lo studente deve saper costruire una prima scheda di inquadramento, dichiarando ciò che sa e ciò che deve ancora accertare."},{"type":"p","text":"Questa unità non abilita a formulare pareri legali. Le classificazioni dei casi didattici sono esercizi condizionati ai fatti dichiarati: l’assenza di informazioni deve produrre domande ulteriori, non una conclusione assertiva."},{"type":"h","text":"1. Individuare il sistema, lo scopo e gli attori"},{"type":"p","text":"La prima domanda non è “quale strumento AI usiamo?”, ma “quale funzione svolge, per chi e con quali effetti?”. La destinazione d’uso prevista è essenziale per comprendere il quadro applicabile. Un assistente che propone bozze di email e un sistema che incide sull’accesso a prestazioni pubbliche non vanno qualificati nello stesso modo soltanto perché entrambi impiegano un modello linguistico."},{"type":"p","text":"Occorre identificare il fornitore del sistema, il deployer (chi lo utilizza sotto la propria autorità), gli eventuali altri soggetti della catena del valore e il titolare/responsabile del trattamento ai sensi del GDPR. Le qualificazioni AI Act e GDPR rispondono a funzioni diverse e non coincidono automaticamente. Riferimenti: Reg. (UE) 2024/1689, art. 3 e artt. 16, 26; Reg. (UE) 2016/679, art. 4."},{"type":"h","text":"2. Un percorso motivato per la classificazione"},{"type":"p","text":"La classificazione come sistema di IA ad alto rischio non dipende dalla sola appartenenza del committente alla pubblica amministrazione, né dalla semplice presenza di un modello generativo. Bisogna confrontare la finalità prevista e le caratteristiche del sistema con le condizioni dell’articolo 6 e con gli allegati I e III. Per le fattispecie dell’allegato III va inoltre esaminata la disciplina delle esclusioni e dei limiti: non è corretto assumere che ogni strumento collegato a un settore elencato sia senz’altro ad alto rischio."},{"type":"p","text":"Esempio didattico: un Comune utilizza un modello per riformulare in linguaggio accessibile avvisi già approvati. Non basta questo dato per concludere che sia alto rischio. Se invece un sistema valuta criteri individuali per l’accesso a determinati benefici, il controllo sull’allegato III diventa centrale. In entrambi i casi vanno documentati finalità effettiva, intervento umano, dati e caratteristiche operative. Riferimento: Reg. (UE) 2024/1689, art. 6 e allegati I, III."},{"type":"h","text":"3. AI Act e GDPR: verifiche parallele"},{"type":"p","text":"Il GDPR entra in gioco quando si trattano dati personali. La base giuridica, la limitazione della finalità, la minimizzazione, la trasparenza, la sicurezza e l’eventuale valutazione d’impatto sul trattamento vanno esaminate indipendentemente dalla qualificazione del sistema come ad alto rischio ai sensi dell’AI Act."},{"type":"p","text":"Viceversa, l’assenza di dati personali in uno specifico flusso non dimostra da sola che tutti gli obblighi dell’AI Act siano irrilevanti. I due regolamenti hanno oggetti diversi e possono applicarsi contemporaneamente. Riferimenti: GDPR artt. 5, 6, 13–14, 32, 35; AI Act artt. 3, 6."},{"type":"h","text":"4. Alfabetizzazione IA e sorveglianza umana"},{"type":"p","text":"Nella formulazione applicabile dal 27 luglio 2026, l’articolo 4 richiede a fornitori e deployer di adottare misure a sostegno dello sviluppo dell’alfabetizzazione in materia di IA delle persone rilevanti, considerate le loro conoscenze tecniche, esperienza, formazione e il contesto di impiego. La disposizione non obbliga a garantire a ciascuno un livello determinato e non prescrive il possesso di una certificazione UNI per ogni dipendente. Riferimenti: AI Act, art. 4; Reg. (UE) 2026/1744, art. 1, punto 5."},{"type":"p","text":"L’articolo 14 disciplina un requisito di progettazione relativo alla sorveglianza umana dei sistemi di IA ad alto rischio; gli obblighi operativi del deployer sono trattati anche dall’articolo 26. Non è sufficiente dichiarare che “un umano controlla”: il progetto deve consentire di comprendere i limiti del sistema, interpretarne l’output, riconoscere l’eccessivo affidamento sull’automazione, decidere di ignorare o ribaltare l’output e, quando previsto, intervenire o interrompere il funzionamento. La supervisione effettiva richiede competenza, autorità e tempo, non soltanto una firma formale. Riferimento: AI Act, art. 14."},{"type":"p","text":"È opportuno prevedere controllo umano anche per utilizzi non classificati ad alto rischio quando l’impatto operativo lo giustifica; in tal caso bisogna distinguere una scelta prudenziale dell’organizzazione da un obbligo specifico derivante dall’articolo 14."},{"type":"h","text":"5. Trasparenza, prove e documentazione"},{"type":"p","text":"Gli obblighi di trasparenza dell’AI Act non sono identici per tutti i sistemi e vanno verificati in base alle circostanze dell’articolo 50. Come buona pratica organizzativa, distinta dalla documentazione obbligatoria prevista per determinate categorie di operatori e sistemi, si possono registrare nome e versione del sistema, finalità, dati immessi, limiti, prove di funzionamento, incidenti e persone responsabili. La presenza di una checklist è utile come controllo interno, ma da sola non dimostra conformità."},{"type":"p","text":"Un’affermazione commerciale come “AI Act compliant” deve essere riportata all’oggetto preciso, agli obblighi concretamente applicabili e alle evidenze disponibili; non equivale alla certificazione professionale di una persona né alla certificazione di un sistema di gestione."},{"type":"h","text":"6. Calendario di applicazione e aggiornamenti"},{"type":"p","text":"Il regolamento contiene disposizioni con date di applicazione differenziate; il regolamento modificativo (UE) 2026/1744 ha aggiornato parte del calendario. È scorretto insegnare una sola data valida per ogni obbligo. In una scheda professionale bisogna citare la disposizione rilevante, il testo consolidato controllato, la data del controllo e le eventuali disposizioni transitorie. Riferimenti: AI Act art. 113; Reg. (UE) 2026/1744."},{"type":"h","text":"Laboratorio — Scheda Comune Aurora"},{"type":"p","text":"Scenario: l’ufficio relazioni con il pubblico vuole un assistente che cerchi in atti pubblici e prepari bozze di risposta. Il sistema non trasmette automaticamente risposte ai cittadini. Alcuni atti possono contenere dati personali. Un dirigente propone di utilizzare lo stesso strumento per raccomandare l’esito di domande individuali di beneficio economico."},{"type":"p","text":"Consegna: prepara una tabella con sei campi: finalità prevista; ruoli coinvolti; tipologie di dati; questioni AI Act da verificare; questioni GDPR da verificare; controlli e decisioni da assegnare alle persone. Distingui lo scenario attuale dall’estensione prospettata. Non scrivere “conforme” o “alto rischio” senza motivazione e fonti."},{"type":"p","text":"Prova di apprendimento: lo studente giustifica oralmente o per iscritto due decisioni, indica almeno una informazione mancante che potrebbe cambiare la classificazione e specifica come correggerebbe un output errato. La rubrica proposta valuta correttezza del ragionamento (40%), attribuzione dei ruoli (20%), controlli e rischi (25%), evidenze e incertezze (15%). I punteggi sono editoriali, non psicometricamente calibrati."},{"type":"h","text":"Fonti puntuali e stato"},{"type":"p","text":"Fonte P1 — Regolamento (UE) 2024/1689, articoli 3, 4, 6, 14, 50, 113 e allegato III: https://ai-act-service-desk.ec.europa.eu/en/ai-act"},{"type":"p","text":"Fonte P2 — Regolamento (UE) 2026/1744, articolo 1, punto 5 e altre modifiche: https://eur-lex.europa.eu/eli/reg/2026/1744/oj"},{"type":"p","text":"Fonte P3 — Regolamento (UE) 2016/679, articoli 4, 5, 6, 13, 14, 32 e 35: https://eur-lex.europa.eu/eli/reg/2016/679/oj"},{"type":"p","text":"Nota di audit: il testo è una rielaborazione editoriale controllata per i nuclei sopra citati, non una verifica indipendente esterna né la dimostrazione della durata nominale. Gli esempi sono ipotetici; il quadro giuridico deve essere rivalutato quando mutano fonti o casi."},{"type":"p","text":"Riesame editoriale del 12 ottobre 2026: la matrice allegata classifica le proposizioni normative del testo corrente. La marcatura «riscontrata» si riferisce al contenuto specifico della proposizione, non costituisce parere legale o revisione esterna."},{"type":"h","text":"Integrazione Gate 0 — esercitazioni riconciliate"},{"type":"h","text":"Scheda di decisione giuridica condizionata"},{"type":"p","text":"Caso A: un Comune usa AI per riformulare un testo pubblico già approvato senza decisioni autonome. Caso B: lo stesso Comune vuole classificare richieste dei cittadini e proporre priorità operative. Per ciascuno annota finalità prevista, ruolo del fornitore e del deployer, persone interessate, tipologie di dati e informazioni mancanti."},{"type":"p","text":"Compito: individua le disposizioni dell’AI Act da verificare e quelle del GDPR eventualmente applicabili; per ciascuna evita conclusioni automatiche come «usato dalla PA = alto rischio». Esplicita quali fatti cambierebbero il ragionamento e quale versione normativa hai consultato."},{"type":"p","text":"La risposta è una scheda di screening e NON un parere legale. Non attribuire obblighi documentali identici a tutti i sistemi: distingui requisiti cogenti applicabili e buone pratiche facoltative."},{"type":"h","text":"Controllo delle affermazioni commerciali"},{"type":"p","text":"Un fornitore dichiara «AI Act compliant» e «privacy garantita». Elenca almeno sei evidenze o precisazioni da richiedere: sistema/versione, destinazione d’uso, ruolo degli operatori, obblighi pertinenti, dati trattati, audit e limiti dichiarati. Non considerare una formula commerciale prova di conformità."},{"type":"p","text":"Riferimenti di consultazione da ricontrollare nella versione vigente: AI Act articoli 3, 4, 6, 14, 26, 50 e allegato III; GDPR articoli 5, 6, 28, 32 e 35, quando pertinenti. Non dedurre che ogni articolo si applichi al caso."},{"type":"p","text":"Nota editoriale: integrazioni didattiche originate dal confronto tra piattaforma e Word precedente; non costituiscono validazione scientifica indipendente."}],"source_status":"Testo riconciliato Gate 0; controllo scientifico indipendente aperto","qa_status":"NON APPROVATO: richiede audit e collaudo"},{"id":"F01.07","title":"Verifica integrata","hours_nominal":1.5,"source_file":"contenuti/F01.07.docx","sha256":"220c26f743508c723a442cac7d3db67f119c7ce72ac589d4a08dcce6dddc5a54","blocks":[{"type":"h","text":"F01.07 — Verifica integrata"},{"type":"p","text":"Materiale studente · versione consolidata in audit · 12 ottobre 2026 · 90 minuti nominali, NON ancora misurati"},{"type":"h","text":"Scopo della prova"},{"type":"p","text":"Applicare in autonomia i concetti delle unità F01.01–F01.06 a un problema nuovo. È una prova di decisione motivata con dati incompleti: il compito non richiede di inventare prestazioni, classificazioni normative o certificazioni."},{"type":"h","text":"Un unico caso simulato: Comune Aurora"},{"type":"p","text":"Il Comune Aurora riceve 12.000 segnalazioni ogni anno; il 5% richiede una risposta tempestiva. Un fornitore propone tre funzionalità: (1) classificare le segnalazioni e segnalare quelle potenzialmente urgenti; (2) riassumere gli allegati; (3) preparare bozze di risposta. Dichiara una accuracy del 95% per il classificatore, senza fornire matrice di confusione, campione di test, modalità di etichettatura, periodo di osservazione o prestazioni per gruppo. Gli allegati potrebbero contenere dati personali e istruzioni ostili. Non sono indicati fornitori di sottoservizi, destinatari dei dati, tempi di conservazione o responsabili della convalida umana."},{"type":"p","text":"La percentuale del 5% corrisponde a circa 600 segnalazioni urgenti annue (12.000 × 0,05), non a 600 errori. Il 95% di accuracy NON determina, da solo, quanti casi urgenti il sistema intercetti."},{"type":"h","text":"Consegna e materiali da produrre"},{"type":"p","text":"Consegna un memo organizzato nelle sezioni A–E, una tabella dei rischi e un diagramma testuale del flusso operativo. Lunghezza consigliata: 650–900 parole complessive, escluse tabelle. Indica i fatti forniti, le ipotesi, i dati mancanti e le condizioni che farebbero cambiare la decisione. Non consultare soluzioni modello."},{"type":"h","text":"A — Funzioni, dati, alternative (20 punti)"},{"type":"p","text":"Per ciascuna delle tre funzionalità: specifica input, output, utente del risultato, tipo di approccio plausibile (regole, apprendimento automatico, generazione di testo), alternativa meno complessa e limiti informativi. Indica i possibili dati personali senza chiamare automaticamente “categorie particolari” ogni dato identificativo. Formula almeno otto domande concrete al fornitore o al Comune, distribuite tra dati, qualità, sicurezza, governance e condizioni contrattuali."},{"type":"h","text":"B — Valutazione tecnica e accettazione (25 punti)"},{"type":"p","text":"Spiega perché una accuracy del 95% è insufficiente per valutare l’individuazione delle urgenze. Richiedi matrice di confusione, precision e recall della classe urgente, criteri di etichettatura, rappresentatività del test, verifica su periodi diversi e confronto con una baseline. Distingui prestazioni dichiarate, misurate e obiettivi proposti. Progetta controlli separati per classificazione, fedeltà dei riassunti agli allegati e correttezza delle bozze. Proponi criteri di accettazione da negoziare, senza spacciarli per soglie di legge."},{"type":"h","text":"C — Rischi, sicurezza e workflow (25 punti)"},{"type":"p","text":"Documenta almeno sei rischi distinti in una tabella con: evento, possibile danno, prevenzione, rilevazione, proprietario del controllo, rischio residuo e condizione di arresto/escalation. Copri almeno: urgente non riconosciuto, affermazione non supportata, divulgazione dati, istruzioni ostili in allegato, prestazioni diseguali e affidamento eccessivo sulla bozza. Rappresenta un workflow che separi acquisizione, controlli dati, inferenza, ve
